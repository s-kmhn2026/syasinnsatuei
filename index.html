<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たのしい がっこう たんけん</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&display=swap');
        
        body {
            font-family: 'Kiwi Maru', sans-serif, system-ui;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #FFF9E6;
        }

        .bouncy {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse-btn {
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 159, 28, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 159, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 159, 28, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden pb-6">

    <!-- ヘッダー -->
    <header class="bg-amber-400 text-white p-4 shadow-lg rounded-b-3xl border-b-4 border-amber-500 sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button id="home-btn" onclick="goToHome()" class="bg-white text-amber-600 font-bold px-4 py-2 rounded-2xl shadow border-2 border-amber-300 flex items-center space-x-2 text-lg active:scale-95 transition">
                <i class="fa-solid fa-house text-xl"></i>
                <span>おうち</span>
            </button>
            <h1 class="text-xl md:text-2xl font-black text-amber-900 tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-camera-retro"></i> たんけん
            </h1>
            <button id="tts-repeat-btn" onclick="repeatCurrentVoice()" class="bg-amber-100 text-amber-800 p-3 rounded-2xl shadow active:scale-95 transition border-2 border-amber-300">
                <i class="fa-solid fa-volume-high text-xl"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main id="app-container" class="max-w-md mx-auto w-full px-4 pt-4 flex-grow flex flex-col justify-center">

        <!-- 1. ホーム画面 -->
        <section id="view-home" class="view-screen flex flex-col items-center justify-center space-y-6 text-center py-4">
            <div class="bg-white p-6 rounded-3xl shadow-xl border-4 border-amber-300 w-full relative overflow-hidden">
                <div class="absolute -top-6 -right-6 text-amber-100 text-9xl font-black -z-0">★</div>
                
                <div class="relative z-10 flex flex-col items-center">
                    <span class="text-6xl mb-3 bouncy">🎒</span>
                    <h2 class="text-2xl font-extrabold text-amber-800 mb-2">がっこう たんけん！</h2>
                    <p class="text-slate-600 font-bold mb-4 text-base">しゃしんを とって<br>バッジを あつめよう！</p>
                    
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 w-full mb-2">
                        <div class="text-sm font-bold text-amber-700">あつめた バッジ</div>
                        <div class="text-3xl font-black text-amber-600" id="home-badge-count">0 / 10</div>
                    </div>
                </div>
            </div>

            <!-- メインボタン -->
            <button onclick="goToLocationList()" class="pulse-btn w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-2xl py-6 rounded-3xl shadow-lg border-b-8 border-emerald-700 flex items-center justify-center space-x-3 active:translate-y-1 active:border-b-4 transition">
                <i class="fa-solid fa-play text-3xl"></i>
                <span>たんけん を はじめる</span>
            </button>

            <button onclick="goToCollection()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-extrabold text-xl py-4 rounded-3xl shadow-lg border-b-8 border-sky-700 flex items-center justify-center space-x-3 active:translate-y-1 active:border-b-4 transition">
                <i class="fa-solid fa-award text-2xl"></i>
                <span>バッジ ずかん</span>
            </button>
        </section>

        <!-- 2. 場所えらび画面 -->
        <section id="view-locations" class="view-screen hidden space-y-4 py-2">
            <div class="bg-white p-4 rounded-2xl shadow-md border-2 border-amber-200 text-center">
                <h2 class="text-xl font-bold text-amber-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-map-location-dot"></i> どこへ いく？
                </h2>
                <p class="text-sm text-slate-500 font-bold">いきたい ばしょを えらんでね</p>
            </div>

            <div id="location-grid" class="grid grid-cols-1 gap-3 pb-4">
                <!-- JavaScriptで10箇所のボタンを生成 -->
            </div>
        </section>

        <!-- 3. カメラ撮影画面 -->
        <section id="view-camera" class="view-screen hidden flex flex-col items-center space-y-4">
            <div class="bg-white p-3 rounded-2xl shadow-md border-2 border-amber-200 w-full text-center">
                <div class="flex justify-center items-center gap-2">
                    <span id="cam-loc-icon" class="text-3xl">🏫</span>
                    <h2 id="cam-loc-title" class="text-2xl font-black text-amber-800">ばしょめい</h2>
                </div>
            </div>

            <!-- ビデオ / キャプチャ表示用コンテナ -->
            <div class="relative w-full aspect-[4/3] bg-black rounded-3xl overflow-hidden shadow-2xl border-4 border-amber-400 flex items-center justify-center">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photo-canvas" class="hidden w-full h-full object-cover"></canvas>
                
                <!-- カメラ枠ガイド -->
                <div class="absolute inset-4 border-4 border-dashed border-white/60 rounded-2xl pointer-events-none flex items-center justify-center">
                    <span class="text-white/40 font-bold text-sm bg-black/40 px-3 py-1 rounded-full">ここに合わせてパシャ！</span>
                </div>
            </div>

            <!-- シャッターボタン -->
            <div class="w-full flex justify-center pt-2">
                <button id="snap-btn" onclick="takePhoto()" class="w-24 h-24 bg-red-500 border-8 border-white rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition">
                    <i class="fa-solid fa-camera text-white text-4xl"></i>
                </button>
            </div>
        </section>

        <!-- 4. 先生かくにん待ち画面 -->
        <section id="view-teacher-check" class="view-screen hidden flex flex-col items-center space-y-4">
            <div class="bg-amber-100 border-2 border-amber-300 p-3 rounded-2xl w-full text-center">
                <h2 class="text-xl font-black text-amber-900">せんせいに みせよう！</h2>
                <p class="text-xs text-amber-700 font-bold">しゃしんを 撮ったら 先生に見せてね</p>
            </div>

            <!-- プレビュー画像 -->
            <div class="relative w-full aspect-[4/3] bg-slate-200 rounded-3xl overflow-hidden shadow-xl border-4 border-white">
                <img id="preview-img" class="w-full h-full object-cover" src="" alt="撮影した写真">
            </div>

            <!-- アクションボタンエリア -->
            <div class="w-full space-y-3 pt-2">
                <!-- 写真保存ボタン (カメラロール保存) -->
                <button onclick="downloadCapturedPhoto()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg py-3 rounded-2xl shadow-md border-b-4 border-emerald-700 flex items-center justify-center space-x-2 active:translate-y-0.5">
                    <i class="fa-solid fa-download text-xl"></i>
                    <span>しゃしんを かめらろーるに ほぞん</span>
                </button>

                <!-- 撮り直しボタン -->
                <button onclick="retakePhoto()" class="w-full bg-slate-400 hover:bg-slate-500 text-white font-bold text-lg py-3 rounded-2xl shadow-md border-b-4 border-slate-600 flex items-center justify-center space-x-2 active:translate-y-0.5">
                    <i class="fa-solid fa-rotate-left text-xl"></i>
                    <span>もういちど とる</span>
                </button>

                <!-- 先生専用 判定ボタンエリア -->
                <div class="bg-white p-4 rounded-3xl shadow-lg border-4 border-indigo-200 w-full text-center mt-4 space-y-3">
                    <div class="text-xs font-bold text-indigo-500 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-user-check"></i> せんせい専用チェック
                    </div>
                    
                    <button onclick="teacherApprove()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-black text-2xl py-4 rounded-2xl shadow-lg border-b-8 border-rose-700 flex items-center justify-center space-x-3 active:translate-y-1 border-2 border-rose-300">
                        <i class="fa-solid fa-stamp text-3xl"></i>
                        <span>はなまる！（合格）</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 5. バッジずかん画面 -->
        <section id="view-collection" class="view-screen hidden space-y-4 py-2">
            <div class="bg-white p-4 rounded-2xl shadow-md border-2 border-amber-200 text-center">
                <h2 class="text-2xl font-black text-amber-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-award text-amber-500"></i> バッジ ずかん
                </h2>
                <p id="collection-subtitle" class="text-sm text-slate-600 font-bold">集めたバッジを タップしてみよう！</p>
            </div>

            <div id="badge-grid" class="grid grid-cols-2 gap-3 pb-6">
                <!-- JavaScriptで10個のバッジスロットを生成 -->
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="max-w-md mx-auto w-full px-4 text-center text-xs text-amber-700/60 font-bold">
        とくべつしえんがっこう たんけんあぷり
    </footer>

    <script>
        /* ----------------------------------------------------
         * データ定義 (10箇所のミッション場所)
         * ---------------------------------------------------- */
        const LOCATIONS = [
            { id: '1pure', title: '１ぷれ', kana: 'いちぷれ', icon: '🎨', color: 'bg-rose-100 text-rose-800 border-rose-300' },
            { id: '3pure', title: '３ぷれ', kana: 'さんぷれ', icon: '🧩', color: 'bg-pink-100 text-pink-800 border-pink-300' },
            { id: 'taiikukan', title: 'たいいくかん', kana: 'たいいくかん', icon: '🏀', color: 'bg-orange-100 text-orange-800 border-orange-300' },
            { id: 'hokenshitsu', title: 'ほけんしつ', kana: 'ほけんしつ', icon: '🏥', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            { id: 'toire', title: 'といれ', kana: 'といれ', icon: '🚻', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
            { id: 'purehabu', title: 'ぷれはぶ', kana: 'ぷれはぶ', icon: '🏠', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
            { id: '5nen1kumi', title: '５ねん１くみ', kana: 'ごねん いちくみ', icon: '1️⃣', color: 'bg-purple-100 text-purple-800 border-purple-300' },
            { id: '5nen2kumi', title: '５ねん２くみ', kana: 'ごねん にくみ', icon: '2️⃣', color: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300' },
            { id: '5nen4kumi', title: '５ねん４くみ', kana: 'ごねん よんくみ', icon: '4️⃣', color: 'bg-violet-100 text-violet-800 border-violet-300' },
            { id: 'kyoushitsu', title: 'きょうしつ', kana: 'きょうしつ', icon: '🏫', color: 'bg-amber-100 text-amber-800 border-amber-300' }
        ];

        // アプリの状態
        let selectedLocation = null;
        let capturedPhotoData = null;
        let badgeStore = {}; // { '1pure': { photo: 'data:...', date: '...' } }
        let currentVoiceText = "";
        let mediaStream = null;

        /* ----------------------------------------------------
         * Web Speech API (音声読み上げ)
         * ---------------------------------------------------- */
        function speak(text) {
            currentVoiceText = text;
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // 前の音声をクリア
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9; // 児童に聞き取りやすいようややゆっくり
            utterance.pitch = 1.2; // 明るいトーン
            window.speechSynthesis.speak(utterance);
        }

        function repeatCurrentVoice() {
            if (currentVoiceText) {
                speak(currentVoiceText);
            } else {
                speak("たんけん アプリへ ようこそ！");
            }
        }

        /* ----------------------------------------------------
         * 効果音生成 (Web Audio API)
         * ---------------------------------------------------- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'shutter') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);

                    noteOsc.type = 'triangle';
                    noteOsc.frequency.value = freq;
                    const startTime = now + idx * 0.12;
                    noteGain.gain.setValueAtTime(0.3, startTime);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                    noteOsc.start(startTime);
                    noteOsc.stop(startTime + 0.3);
                });
            }
        }

        /* ----------------------------------------------------
         * 画面遷移・ナビゲーション
         * ---------------------------------------------------- */
        function showScreen(screenId) {
            document.querySelectorAll('.view-screen').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.remove('hidden');
                target.classList.add('pop-in');
            }
        }

        function goToHome() {
            playSound('click');
            stopCamera();
            updateHomeStats();
            showScreen('view-home');
            speak("おうちの がめん。 たんけんを はじめる ボタンを おしてね！");
        }

        function goToLocationList() {
            playSound('click');
            renderLocationList();
            showScreen('view-locations');
            speak("どこへ いく？ いきたい ばしょを えらんでね！");
        }

        function goToCollection() {
            playSound('click');
            renderCollection();
            showScreen('view-collection');
            speak("バッジずかん。 集めた バッジを 見てみよう！");
        }

        /* ----------------------------------------------------
         * 場所リストのレンダリング
         * ---------------------------------------------------- */
        function renderLocationList() {
            const grid = document.getElementById('location-grid');
            grid.innerHTML = '';

            LOCATIONS.forEach(loc => {
                const isCleared = badgeStore[loc.id] ? true : false;
                const card = document.createElement('button');
                card.onclick = () => selectLocation(loc);
                
                card.className = `w-full p-4 rounded-3xl border-4 flex items-center justify-between shadow-md active:scale-95 transition ${loc.color} ${isCleared ? 'bg-opacity-50 border-amber-400' : ''}`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-4xl p-2 bg-white/80 rounded-2xl shadow-inner">${loc.icon}</span>
                        <div class="text-left">
                            <div class="text-xl font-black">${loc.title}</div>
                            <div class="text-xs font-bold text-slate-500">${isCleared ? '✨ クリア済み' : 'しゃしんを とりにいこう！'}</div>
                        </div>
                    </div>
                    <div>
                        ${isCleared 
                            ? '<span class="bg-amber-400 text-amber-900 font-extrabold px-3 py-2 rounded-2xl shadow text-sm flex items-center gap-1"><i class="fa-solid fa-crown text-amber-700"></i> ゲット！</span>' 
                            : '<i class="fa-solid fa-chevron-right text-slate-400 text-2xl"></i>'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectLocation(loc) {
            playSound('click');
            selectedLocation = loc;
            document.getElementById('cam-loc-icon').textContent = loc.icon;
            document.getElementById('cam-loc-title').textContent = loc.title;
            
            showScreen('view-camera');
            startCamera();
            speak(`${loc.kana} へ しゅっぱつ！ ついたら しゃしんを とってね！`);
        }

        /* ----------------------------------------------------
         * カメラ機能 (Webcam / Stream)
         * ---------------------------------------------------- */
        async function startCamera() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('photo-canvas');
            video.classList.remove('hidden');
            canvas.classList.add('hidden');

            try {
                if (mediaStream) {
                    stopCamera();
                }
                // 背面カメラ(environment)を優先
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = mediaStream;
            } catch (err) {
                console.error("Camera access error:", err);
                // カメラが直接使えない環境（一部のモックブラウザ等）のためのフォールバック処理
                speak("カメラが ひらけませんでした。 がめんを タップして テストしゃしんを とるよ！");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function takePhoto() {
            playSound('shutter');
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('photo-canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            if (mediaStream && video.videoWidth) {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                capturedPhotoData = canvas.toDataURL('image/jpeg');
            } else {
                // カメラ映像が得られない場合のフォールバックイラスト生成
                context.fillStyle = "#FFEDD5";
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.font = "bold 40px 'Kiwi Maru', sans-serif";
                context.fillStyle = "#9A3412";
                context.textAlign = "center";
                context.fillText(selectedLocation.title, canvas.width / 2, canvas.height / 2 - 20);
                context.font = "80px sans-serif";
                context.fillText(selectedLocation.icon, canvas.width / 2, canvas.height / 2 + 70);
                capturedPhotoData = canvas.toDataURL('image/jpeg');
            }

            stopCamera();
            document.getElementById('preview-img').src = capturedPhotoData;
            showScreen('view-teacher-check');
            speak("しゃしんが とれたよ！ せんせいに みせてね！");
        }

        function retakePhoto() {
            playSound('click');
            showScreen('view-camera');
            startCamera();
            speak("もういちど とりなおすよ！");
        }

        /* ----------------------------------------------------
         * カメラロール（端末）保存機能
         * ---------------------------------------------------- */
        function downloadCapturedPhoto() {
            playSound('click');
            if (!capturedPhotoData) return;

            const a = document.createElement('a');
            a.href = capturedPhotoData;
            a.download = `がっこうたんけん_${selectedLocation.id}_${new Date().toISOString().slice(0,10)}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            speak("しゃしんを かめらろーるに ほぞん したよ！");
        }

        /* ----------------------------------------------------
         * 先生の判定 & バッジ付与
         * ---------------------------------------------------- */
        function teacherApprove() {
            playSound('fanfare');
            
            // クラッカー紙吹雪演出
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // バッジの保存
            badgeStore[selectedLocation.id] = {
                photo: capturedPhotoData,
                date: new Date().toLocaleDateString('ja-JP')
            };
            saveData();

            speak(`すごーい！ はなまる！ ${selectedLocation.kana} の バッジを ゲットしたよ！`);

            setTimeout(() => {
                goToCollection();
            }, 2500);
        }

        /* ----------------------------------------------------
         * バッジ図鑑のレンダリング
         * ---------------------------------------------------- */
        function renderCollection() {
            const grid = document.getElementById('badge-grid');
            grid.innerHTML = '';

            let clearedCount = 0;

            LOCATIONS.forEach(loc => {
                const badge = badgeStore[loc.id];
                const isCleared = !!badge;
                if (isCleared) clearedCount++;

                const item = document.createElement('div');
                item.className = `bg-white rounded-3xl p-3 border-4 shadow-md flex flex-col items-center justify-between text-center relative overflow-hidden active:scale-95 transition ${isCleared ? 'border-amber-400' : 'border-slate-200 bg-slate-50 opacity-70'}`;
                
                item.onclick = () => {
                    if (isCleared) {
                        playSound('click');
                        speak(`これは ${loc.kana} の バッジだよ！ とっても 上手に とれたね！`);
                    } else {
                        playSound('click');
                        speak(`ここは まだ バッジを もっていないよ。 ${loc.kana} へ しゃしんを とりに いこう！`);
                    }
                };

                item.innerHTML = `
                    <div class="w-full aspect-square rounded-2xl mb-2 flex items-center justify-center overflow-hidden bg-amber-50 relative border-2 ${isCleared ? 'border-amber-300' : 'border-slate-200'}">
                        ${isCleared 
                            ? `<img src="${badge.photo}" class="w-full h-full object-cover">
                               <div class="absolute bottom-1 right-1 bg-amber-400 text-white rounded-full w-8 h-8 flex items-center justify-center text-lg shadow">👑</div>`
                            : `<span class="text-5xl grayscale opacity-40">${loc.icon}</span>`}
                    </div>
                    <div class="font-extrabold text-sm ${isCleared ? 'text-amber-900' : 'text-slate-400'}">${loc.title}</div>
                    <div class="text-[10px] font-bold text-slate-400 mt-0.5">${isCleared ? '✨ ゲット！' : '未クリア'}</div>
                `;

                grid.appendChild(item);
            });

            // サブタイトルとカウント更新
            document.getElementById('collection-subtitle').textContent = `あつめた バッジ: ${clearedCount} / ${LOCATIONS.length}`;

            // 全クリア判定
            if (clearedCount === LOCATIONS.length) {
                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
                    speak("ぜんぶの バッジが あつまったよ！ たんけん はかせだね！ すごい！");
                }, 1000);
            }
        }

        /* ----------------------------------------------------
         * ローカルストレージ & ステータス更新
         * ---------------------------------------------------- */
        function updateHomeStats() {
            const clearedCount = Object.keys(badgeStore).length;
            document.getElementById('home-badge-count').textContent = `${clearedCount} / ${LOCATIONS.length}`;
        }

        function saveData() {
            try {
                localStorage.setItem('tokubetsu_school_badges', JSON.stringify(badgeStore));
            } catch(e) {
                console.error("Storage save failed", e);
            }
        }

        function loadData() {
            try {
                const data = localStorage.getItem('tokubetsu_school_badges');
                if (data) {
                    badgeStore = JSON.parse(data);
                }
            } catch(e) {
                console.error("Storage load failed", e);
            }
        }

        /* ----------------------------------------------------
         * アプリ初期化
         * ---------------------------------------------------- */
        window.onload = () => {
            loadData();
            updateHomeStats();
            
            // 初回タップ時の音声有効化（ブラウザの自動再生制限対策）
            document.body.addEventListener('click', function initAudio() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                document.body.removeEventListener('click', initAudio);
            }, { once: true });

            speak("たんけん アプリへ ようこそ！ スタート ボタンを おしてね！");
        };
    </script>
</body>
</html>
